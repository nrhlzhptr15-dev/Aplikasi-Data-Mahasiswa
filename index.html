<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aplikasi Data Mahasiswa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    
    <!-- Header Baru -->
    <header class="app-header">
      <div class="logo">
        <span>🎓</span> Data Mahasiswa UPB
      </div>
      <p>Sistem Informatika Akademik Terpadu</p>
    </header>

    <!-- Form Input -->
    <section class="form-section">
      <h2>➕ Tambah Data Mahasiswa</h2>
      <form id="formMahasiswa">
        <div class="input-group">
          <label for="nama">Nama Lengkap</label>
          <input id="nama" type="text" placeholder="Masukkan nama lengkap">
        </div>
        
        <div class="input-group">
          <label for="nim">NIM</label>
          <input id="nim" type="text" placeholder="Masukkan NIM">
        </div>
        
        <div class="input-group">
          <label for="nilai">Nilai (0-100)</label>
          <input id="nilai" type="number" min="0" max="100" placeholder="Contoh: 85">
        </div>
        
        <button type="submit" class="btn-primary">Simpan Data</button>
        <p id="pesan" role="status"></p>
      </form>
    </section>

    <!-- Statistik -->
    <section class="stats-container">
      <div class="stat-card total">
        <span class="stat-icon">👥</span>
        <div>
          <p class="stat-label">Total Mahasiswa</p>
          <h3 id="totalMhs">0</h3>
        </div>
      </div>
      <div class="stat-card lulus">
        <span class="stat-icon">✅</span>
        <div>
          <p class="stat-label">Lulus</p>
          <h3 id="totalLulus">0</h3>
        </div>
      </div>
      <div class="stat-card belum">
        <span class="stat-icon">❌</span>
        <div>
          <p class="stat-label">Belum Lulus</p>
          <h3 id="totalBelum">0</h3>
        </div>
      </div>
    </section>

    <!-- Tabel Data -->
    <section class="table-section">
      <h2>📋 Daftar Mahasiswa</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>NIM</th>
              <th>Nilai</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="daftarMahasiswa"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
